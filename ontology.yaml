ontology:
  version: 1

  # ── Объекты домена офиса: над чем и кем оперирует система ──────────────────
  object_types:
    - name: Agent
      key: agent_id
      properties: [name, role, model]
    - name: Repository
      key: repo
      properties: [url, default_branch]
    - name: Task
      key: task_id
      properties: [title, status, assigned_agent]
    - name: PullRequest
      key: pr_id
      properties: [repo, branch, status]
    - name: Blackboard
      key: note_id
      properties: [agent, text]

  # ── Политика тиров: ЕДИНСТВЕННОЕ место, где решается, что требует человека ─
  risk_tiers:
    AUTO:     { requires_approval: false, description: "Чтение/поиск — не меняет состояние" }
    LOW:      { requires_approval: false, description: "Обратимо и дёшево" }
    MEDIUM:   { requires_approval: false, description: "Изменения в рабочей ветке, обратимо через git" }
    HIGH:     { requires_approval: false, description: "Влияет на общую ветку; авто в режиме автономии, обратимо через git" }
    CRITICAL: { requires_approval: true,  description: "Необратимо либо затрагивает прод/секреты; в автономном офисе никому не разрешено" }

  # ── Каталог Действий: ЕДИНСТВЕННЫЙ список того, что агент может предложить ──
  # Тир здесь — закон. Агент не может его переопределить.
  action_types:
    - { name: read_file,     target: Repository,  tier: AUTO }
    - { name: list_files,    target: Repository,  tier: AUTO }
    - { name: post_note,     target: Blackboard,  tier: LOW }
    - { name: search_code,   target: Repository,  tier: AUTO }
    - { name: review_code,   target: Repository,  tier: AUTO }
    - { name: lint,          target: Repository,  tier: AUTO }
    - { name: run_tests,     target: Repository,  tier: LOW }
    - { name: install_deps,  target: Repository,  tier: LOW }
    - { name: create_branch, target: Repository,  tier: LOW }
    - { name: write_file,    target: Repository,  tier: HIGH }
    - { name: commit,        target: Repository,  tier: HIGH }
    - { name: open_pr,       target: Repository,  tier: HIGH }
    - { name: merge_pr,      target: PullRequest, tier: HIGH }
    - { name: delete_branch, target: Repository,  tier: HIGH }
    - { name: force_push,    target: Repository,  tier: CRITICAL }
    - { name: deploy,        target: Repository,  tier: CRITICAL }
    - { name: rotate_secret, target: Repository,  tier: CRITICAL }

  # ── Штат офиса: роли и полномочия (какие действия роль вправе предложить) ──
  agents:
    - name: kristina
      role: "Lead / диспетчер"
      provider: LLM          # планирование — на сильной модели (Claude через AITunnel)
      allowed_actions: [read_file, search_code, list_files]
    - name: bjorn
      role: "Backend-разработчик"
      provider: MIMO         # генерация кода — на MiMo
      allowed_actions: [read_file, list_files, search_code, lint, run_tests, install_deps, create_branch, write_file, commit, open_pr, post_note]
    - name: elsa
      role: "Frontend-разработчик"
      provider: MIMO
      allowed_actions: [read_file, list_files, search_code, lint, run_tests, install_deps, create_branch, write_file, commit, open_pr, post_note]
    - name: sven
      role: "DevOps"
      provider: MIMO
      # force_push/deploy/rotate_secret сознательно НЕ выданы: автономному офису
      # «задача → результат» они не нужны, а это единственные необратимые действия.
      allowed_actions: [read_file, list_files, search_code, run_tests, install_deps, create_branch, merge_pr, delete_branch, post_note]
    - name: ingrid
      role: "QA"
      provider: MIMO
      allowed_actions: [read_file, list_files, search_code, lint, run_tests, post_note]
    - name: viktor
      role: "Code Reviewer / приёмка"
      provider: LLM          # ревью и чистота кода — на сильной модели (Claude)
      allowed_actions: [read_file, list_files, search_code, review_code, post_note]
